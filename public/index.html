<script>
let CS=null,PC=null,SORT='Rarity',T=localStorage.tok,D,BV,tab='farm',sel=null,busy=0,pend=null,LOG=[],POS={},AC;
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n),rnd=(a,b)=>a+Math.random()*(b-a);
function floatText(t){const e=document.createElement('div');e.className='ft';e.textContent=t;const r=$('#tc'),b=r?r.getBoundingClientRect():{left:100,top:10};e.style.left=b.left+'px';e.style.top=(b.top+22)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
setInterval(()=>{if(!D||CS===null||CS===D.coins)return;CS+=(D.coins-CS)*.3;if(Math.abs(D.coins-CS)<1)CS=D.coins;const c=$('#tc');if(c)c.textContent=fmt(CS)},80);

function beep(f,d=.12,t='sine',v=.07,f2){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;if(f2)o.frequency.linearRampToValueAtTime(f2,AC.currentTime+d);g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
const baa=()=>beep(330,.4,'sawtooth',.05,260);
async function api(p,b){const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json','x-token':T||''},body:JSON.stringify(b||{})});if(r.status==401){localStorage.removeItem('tok');T=null;login();throw 0}return r.json()}
async function act(a,b){const r=await api('act/'+a,b);if(r.d){D=r.d;D.at=Date.now()}if(r.err)toast(r.err);if(r.newSp&&r.newSp.length){toast('★ Special sheep unlocked: '+r.newSp.join(', '));beep(700,.15,'triangle');beep(1000,.2,'triangle');beep(1500,.4,'sine',.09);confetti(80)}if(r.newDex)toast('📖 New Sheepdex entr'+(r.newDex>1?'ies':'y')+'!');if(r.flv){toast('🏡 Farm level '+r.flv+'!');beep(660,.12,'triangle');beep(990,.2,'triangle');confetti(30)}return r}
function sparks(c){for(let i=0;i<30;i++){const d=document.createElement('div'),a=Math.random()*6.283,r=120+Math.random()*220;d.className='sp';d.style.cssText=`--c:${c};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}}
function confetti(n=50){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='cf';c.style.left=rnd(0,100)+'vw';c.style.background=`hsl(${rnd(0,360)},90%,60%)`;c.style.animationDelay=rnd(0,.8)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
// ---------- art ----------
function sv(g,w=120){const bd=(-Math.random()*4).toFixed(2),F=g.form|0,R=G.RAR[g.r],id='g'+Math.random().toString(36).slice(2,6),ev=g.evo|0,sat=25+g.r*13,li=95-g.r*4,hh=F==2?205:g.hue,wc=`hsl(${hh},${sat}%,${li}%)`,wl=`hsl(${hh},${sat}%,${Math.min(99,li+5)}%)`,ws=ev>1?'#e6a800':`hsl(${hh},${sat+15}%,${li-32}%)`,fc=`hsl(${(g.hue+40)%360},25%,${24+g.r*3}%)`,fl=`hsl(${(g.hue+40)%360},25%,${36+g.r*3}%)`,has=x=>g.ex.includes(x),W=`url(#${id}w)`,hc=[fc,`hsl(${g.hue},50%,45%)`,fc,`hsl(${g.hue},75%,72%)`,'#9aa6b4','#eef1ff','#3b2b2b',`hsl(${g.hue},85%,72%)`,`hsl(${g.hue},45%,58%)`,`hsl(${g.hue},100%,75%)`,'#ff9f1c'][F],bc=[0,`hsl(${g.hue},50%,40%)`,0,`hsl(${g.hue},80%,62%)`,'#7d8997','#dfe5ff','#2a1f1f',`hsl(${g.hue},85%,62%)`,`hsl(${g.hue},45%,42%)`,`hsl(${g.hue},100%,62%)`,'#ffe066'][F],fly=[2,5,7,9].includes(F),led=`hsl(${g.hue},100%,60%)`;
let s=`<svg viewBox="-10 -30 150 160" width="${w}" height="${w*1.07}" style="overflow:visible"><defs><radialGradient id="${id}w" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="${wl}"/><stop offset="1" stop-color="${wc}"/></radialGradient><radialGradient id="${id}a"><stop offset="0" stop-color="${has('galaxy')?'#7a5cff':ev?'#ffe27a':R.c}" stop-opacity=".75"/><stop offset="1" stop-color="${R.c}" stop-opacity="0"/></radialGradient></defs>`;
if(has('galaxy')||g.r>=4||ev)s+=`<circle class="pulse" cx="60" cy="50" r="${ev?80:70}" fill="url(#${id}a)"/>`;
if(g.sp)s+=`<circle cx="60" cy="50" r="74" fill="none" stroke="#ffd34d" stroke-width="2" stroke-dasharray="3 5"/><text x="-6" y="-14" font-size="18" fill="#ffd34d">★</text>`;
if(g.r>=6)s+=`<circle cx="60" cy="50" r="76" fill="none" stroke="${R.c}" stroke-width="3" stroke-dasharray="2 6"/>`;
if(ev>1)s+=`<circle cx="60" cy="50" r="64" fill="none" stroke="#ffd34d" stroke-width="2" stroke-dasharray="6 8" opacity=".8"/>`;
if(ev)s+=`<text x="-4" y="10" fill="#ffd34d" font-size="14">✦</text><text x="116" y="96" fill="#fff" font-size="12">✦</text>`;
s+=`<ellipse cx="58" cy="${fly?110:100}" rx="${fly?30:42}" ry="6" fill="#000" opacity="${fly?.1:.16}"/>`;

function buildScene(){const sc=$('#scene');if(!sc)return;sc.style.background=skyBg();for(let i=0;i<3;i++){const b=document.createElement('span');b.className='bf';b.textContent=NIGHT()?'✨':'🦋';b.style.cssText=`left:${rnd(10,85)}%;top:${rnd(30,60)}%;animation-delay:-${i*2}s`;sc.appendChild(b)}
D.sheep.filter(x=>!G.isEgg(x)).slice(0,24).forEach(s=>{const p=POS[s.id]=POS[s.id]||{x:rnd(5,85),y:rnd(50,78)},d=document.createElement('div');d.className='ws';d.dataset.id=s.id;d.style.left=p.x+'%';d.style.top=p.y+'%';d.innerHTML=`<div>${sv(s,66)}</div>`;if(s.r>=3||s.sp)d.style.filter=`drop-shadow(0 0 7px ${s.sp?'#ffd34d':G.RAR[s.r].c})`;d.onclick=()=>{d.classList.add('j');setTimeout(()=>d.classList.remove('j'),400);speak(d,1);baa()};sc.appendChild(d)})}
function say(el,t){const b=document.createElement('span');b.className='bub';b.textContent=t;el.appendChild(b);setTimeout(()=>b.remove(),1800)}
const BAAS=['Baa!','Baaaa!','Meh!','Baaa-aa-aa!','Mehehehe','Bleat!','Mmmbaaa','BAA!','Baa?','Meeeeh','Baa baa','Beh.','Baaaaaaaa!','Mbaa!'],QUOTES=['I once watched a cloud for forty years. It never learned my name.','The grass is not greener. The grass is merely louder.','Somewhere, a mattress dreams of me. I do not dream of it back.','I have seen the bottom of the pond. It was just more pond.','Do not trust the fence. The fence knows what it did.','Every sheep you count is a sheep that counts you back.','I am not a sheep. I am three raccoons in a very convincing fleece.','The moon owes me money, and I intend to collect.','In the end, we are all just wool and warm regret.','I ate a sock in 2019. The sock has been avenging itself ever since.','Tell my story to the turnips. They will listen. They always do.','The barn is a mouth. Do not look at its teeth.','I have calculated the exact day I become a sandwich. It is a Tuesday.','Your coins are only loud pieces of the sun.','Long ago I made a promise to a hill. The hill is now collecting.'];
function speak(el,click){const s=D&&D.sheep.find(x=>x.id==el.dataset.id);if(Math.random()<(click?.03:.025))return deep(s?s.name:'A sheep');say(el,BAAS[Math.floor(Math.random()*BAAS.length)])}

const qcard=()=>`<div class="card"><b>📜 Daily quests</b> (they reset every day)${((D.q&&D.q.l)||[]).map((x,i)=>`<div class="bl"><span>${G.QUESTS[x.k][0]}: <b>${Math.min(x.h,x.n)}/${x.n}</b> · 🪙${fmt(x.r)}</span><button ${x.c||x.h<x.n?'disabled':''} onclick="claimq(${i})">${x.c?'Done ✓':'Claim'}</button></div>`).join('')}</div>`;
const farmCard=()=>{const f=G.farmLv(D.fxp);return`<div class="card"><b>🏡 Farm level ${f.lv}</b><div class="bar"><i style="width:${100*f.into/f.need}%"></i></div><small>${f.into}/${f.need} XP. Earn XP by selling wool, hatching, upgrading, training, finishing quests and winning battles. Levels unlock bigger eggs, higher building levels and Adventure stages (level 6 unlocks Herds). Resets when you prestige.</small></div>`};
const prestigeCard=()=>{const n=D.sheep.filter(s=>s.r>=6&&!s.sp).length,pr=D.pr|0;return`<div class="card"><b>🌟 Prestige${pr?' level '+pr+' · wool ×'+(1+pr):''}</b><br>Celestial sheep: <b>${n}/3</b>. ${n>=3?'You can prestige! It resets your coins, sheep, buildings and Adventure for a permanent wool boost'+(pr?' and levels up your duck, which rests in an egg for 24 hours.':', plus a special duck, Quackers, who survives every rebirth but spends 24 hours in an egg after each prestige.'):'Hatch 3 Celestial sheep (special sheep do not count) to unlock prestige.'}<br><button ${n<3?'disabled':''} onclick="prestige()" style="background:#7a5cff;box-shadow:0 3px 0 #4a2fb0">🌟 Prestige</button></div>`};
async function prestige(){if(!confirm('PRESTIGE? You will LOSE all your sheep (except Quackers), coins, buildings and Adventure progress. You keep a permanent wool multiplier. This cannot be undone.'))return;const r=await act('prestige');if(r.prestiged){confetti(160);beep(500,.3,'triangle');beep(800,.3,'triangle');beep(1200,.6,'sine',.09);toast('🌟 Prestige '+r.prestiged+'! Wool ×'+(1+r.prestiged));POS={}}render()}

V.hatch=()=>{const sec=(t,c)=>`<h3 style="margin:14px 4px 4px">${t}</h3><div class="eggs">${G.EGG.map((e,i)=>e.cat==c?eggCard(e,i):'').join('')}</div>`;return`<div class="card">Pasture: <b>${D.sheep.length}/${D.calc.slots}</b> sheep. Better eggs cost more and make rare sheep more likely, but high rarities are always hard to get.</div>`+sec('🥚 Farm eggs',0)+sec('✨ Elemental eggs: always one element',1)+sec('🧬 Form eggs: always one form',2)};

for(let i=0;i<3+s.r;i++){await sleep(450);beep(220+i*50,.1,'square',.04);$('#eg').style.animationDuration=Math.max(.1,.35-i*.05)+'s';if(i==2){$('#eg').style.filter=`drop-shadow(0 0 ${12+s.r*6}px ${R.c})`;$('#hm').textContent=s.r>=3?'Whoa… this one feels SPECIAL…':'Crack! Crack!'}}

const TUT=()=>[
`<h2>🐑 Welcome to EGG &amp; WOOL!</h2><p>You run a farm full of sheep. Sheep make <b>wool</b>, wool turns into <b>coins</b>, and coins buy <b>eggs</b> that hatch new (and stranger) sheep. Build the best flock, then battle other players!</p><div style="text-align:center">${sv(G.roll(0),110)}${egg(0,60)}</div><p>This guide takes a minute. You can reopen it any time with the <b>❓ Help</b> button.</p>`,
`<h2>🧶 Earning money</h2><ul><li>Every sheep makes wool while you're playing (nothing is earned while you're away). Rarer sheep make much more.</li><li>On the <b>Farm</b> tab, press <b>Sell all wool</b> to turn it into 🪙 coins. The <b>barn</b> only holds so much, so sell before it fills.</li><li>🏡 Your <b>farm level</b> rises as you play (selling, hatching, battling, quests). Higher levels unlock bigger eggs, higher building levels and Adventure stages, and level 6 unlocks Herds.</li><li>Spend coins on <b>Buildings</b>: Barn (more storage), Shearing Shed (+25% wool), Pasture (room for more sheep), Market (better prices).</li><li>Catch the <b>✨ golden sheep</b> that runs past, and claim your <b>daily gift</b> and <b>daily quests</b> for bonus coins.</li></ul>`,
`<h2>🥚 Eggs &amp; hatching</h2><ul><li>Go to the <b>Hatchery</b>. Each egg shows its odds. Cheap eggs mostly give Common sheep; pricey eggs give rarer ones, but top rarities are always tough.</li><li>Rarities, lowest to highest: <span style="color:#8a9a9a">Common</span>, <span style="color:#3fae4a">Uncommon</span>, <span style="color:#3d7bff">Rare</span>, <span style="color:#a649ff">Epic</span>, <span style="color:#ffb400">Legendary</span>, <span style="color:#ff4fa3">Mythic</span>, <span style="color:#37e6ff">Celestial</span>.</li><li><b>Elemental eggs</b> always give one element. <b>Form eggs</b> always give one form (Alien, Robo, Ghost...).</li><li>You need a free Pasture slot per sheep. Release spare sheep in the <b>Flock</b> tab for coins, or upgrade the Pasture. <b>×10</b> hatches ten at once.</li><li>The <b>Sheepdex</b> tracks every form and rarity you've found.</li></ul>`,
`<h2>🔥 Elements &amp; types</h2><p>Every sheep has an element. Hitting a weak spot does <b>50% more</b> damage; hitting a strong one does less.</p>${G.EL.map((n,i)=>`<div><span style="color:${G.ELC[i]}">●</span> <b>${n}</b>: strong vs ${G.matchup(i).s.join(', ')||'nothing'} · weak to ${G.matchup(i).w.join(', ')||'nothing'}</div>`).join('')}<p style="font-size:13px">Sheep also have a <b>role</b> (Bruiser, Tank, Healer, Trickster), a <b>trait</b> like Lucky or Zoomy, and a <b>form</b>. Check the card in your Flock tab.</p>`,
`<h2>⚔️ Battles</h2><ul><li>In the <b>Flock</b> tab pick a team of 3 (tap a sheep, then a slot, or press <b>Auto-pick</b>).</li><li>Each turn, pick a move, then a target. Strong moves have a <b>cooldown</b> (the number in brackets).</li><li>Rare sheep unlock an <b>element move</b>, Legendary and above an <b>ultimate</b>. Evolving unlocks more role moves.</li><li><b>🌐 Live match</b>: wait for a real player and fight in real time. <b>🤖 Quick match</b>: play any time against another farmer's saved team or a bot.</li><li>Wins earn coins, rating, and XP for your team. Long fights end with a storm that hurts everyone.</li></ul>`,
`<h2>🗺️ Adventure &amp; growing your sheep</h2><ul><li><b>Adventure</b> has 30 stages of silly bosses. Each first clear pays coins, and every 5th stage gives a free sheep.</li><li><b>★ Special sheep</b> can't be hatched. Clear Adventure stages and hit goals to unlock them (see the Sheepdex tab).</li><li><b>Train</b> a sheep with coins to raise its level. Sheep also gain levels from battles.</li><li><b>Evolve</b> a sheep at Lv5 and again at Lv12 for +15% stats, +25% wool and a new move.</li></ul><h3>Quick tips</h3><ul><li>New sheep start weak at Lv1. Train them and win battles to level up. It matters a lot!</li><li>Spend early coins on Barn, Pasture and cheap eggs.</li><li>🌟 <b>Prestige</b> once you own 3 Celestial sheep: a reset with a permanent wool boost and a special duck.</li><li>🐏 At farm level 6, join a <b>Herd</b> (up to 5 players) to earn herd goals together and fight Herd Wars. Herd sheep need time in the herd, and a sheep of the same rarity of your own. Herd sheep leave your flock if you leave your herd or it hasn't earned them.</li><li>Mix roles and elements in your team. A team of one element is easy to counter.</li><li>Rarity isn't everything: a well-picked team can beat a rarer one.</li></ul>`,
`<h2>🎪 More to do</h2><ul><li><b>🏁 Races</b> (Activities tab): race as often as you like. Speed and the track's element decide the winner. Each race pays a little XP and coins, and every 5th race opens a bonus chest.</li><li><b>🧭 Ruin Expeditions</b>: send up to 3 sheep to an abandoned building and clear it room by room against enemy sheep. Every room pays a little XP and coins, and the boss gives a bonus. Bring the right elements, and retreat when your party is hurt.</li><li><b>📖 Sheepdex</b>: every new form and rarity you discover gives XP and a permanent wool bonus. Hit collection milestones for free sheep and special rewards.</li><li>Quests, the daily gift and golden sheep all give farm XP too, and farm levels unlock bigger eggs, buildings and Adventure stages.</li></ul>`];

abled':''} style="background:#8a4fff" onclick="evolve('${id}')">Evolve ${s.lv<nx?'(needs Lv'+nx+')':'🪙'+fmt(cost)}</button>`:''}${s.sp?'':`<button style="background:#c55" onclick="drel('${id}','${s.name}',${R.v})">Release +${R.v}</button>`}<button onclick="closeOv()">Close</button></div></div>`}

V.clan=()=>{const c=CLD,fl=G.farmLv(D.fxp).lv;if(!c)return`<div class="card"><h3>🐏 Herds</h3><p>A herd is a clan of up to 5 players. Level your herd by donating, win battles together for goals and daily rewards, chat, and fight Herd Wars where every member gets an attack.</p>${fl<6?`<p><b>🔒 Reach farm level 6 to join or create a herd.</b> You are level ${fl}.</p>`:''}<input id="cn" placeholder="New herd name" maxlength="16"><button ${fl<6?'disabled':''} onclick="cdo('create',{name:$('#cn').value})">Create herd</button></div><div class="card"><b>Open herds</b>${CLIST.map(x=>`<div class="bl"><span><b>${esc(x.name)}</b> · lv ${x.lv} · ${x.n}/5 · 🏆 ${x.wins} war wins${x.motto?`<br><small><i>“${esc(x.motto)}”</i></small>`:''}</span><button ${fl<6?'disabled':''} onclick="cdo('join',{name:'${x.name}'})">Join</button></div>`).join('')||'<p>No open herds yet. Create the first one!</p>'}</div>`;
const w=c.war,hrs=w?Math.max(0,Math.ceil((w.end-Date.now())/36e5)):0,st=a=>a===undefined?'⏳ not fought':a==-1?'⚔️ fighting':a?'✅ won':'❌ lost',inH=(Date.now()-(D.cjoin||Date.now()))/36e5,L=c.lv;
return`<div class="card"><h3>🐏 ${esc(c.name)} <small>· herd level ${L.lv}</small></h3>${c.motto?`<p><i>“${esc(c.motto)}”</i></p>`:''}${c.members.map(m=>`<div class="bl"><span>${m.lead?'👑 ':''}<b>${esc(m.name)}</b> · 🏆 ${m.rating} · 🐑 ${m.sheep}<br><small>💰 ${fmt(m.don)} donated · ⚔️ ${m.mw} wins for the herd</small></span><span>${w?st(m.atk):''} ${c.owner&&!m.lead?`<button style="padding:2px 8px;font-size:11px;background:#8a4fff;box-shadow:none" onclick="if(confirm('Make ${esc(m.name)} the leader?'))cdo('promote',{key:'${m.key}'})">👑</button> <button style="padding:2px 8px;font-size:11px;background:#c55;box-shadow:none" onclick="if(confirm('Kick ${esc(m.name)}?'))cdo('kick',{key:'${m.key}'})">Kick</button>`:''}</span></div>`).join('')}<small>${c.members.length}/5 members · 👑 leader can kick, promote, set the motto and start wars · ${c.wins} war wins · ${fmt(c.bw)} battles won together · you joined ${Math.floor(inH)}h ago</small>${c.owner?`<br><input id="mo" placeholder="Herd motto" maxlength="40" value="${esc(c.motto)}" style="width:65%"> <button onclick="cdo('motto',{text:$('#mo').value})">Save</button>`:''}</div>
<div class="card"><b>⭐ Herd level ${L.lv}/5</b> · +${Math.round(L.bonus*100)}% wool for every member<div class="bar"><i style="width:${L.next?Math.min(100,100*c.pts/L.next):100}%"></i></div><small>${L.next?fmt(c.pts)+'/'+fmt(L.next)+' coins donated for the next level':'Max level!'}</small></div>
<div class="card"><b>📅 Herd challenge</b>: win 8 battles together today (${Math.min(8,c.dw)}/8)<div class="bar"><i style="width:${Math.min(100,100*c.dw/8)}%"></i></div><button ${c.dw<8||c.dc?'disabled':''} onclick="cdo('claimdaily')">${c.dc?'Claimed today ✓':'Claim reward'}</button></div>
<div class="card"><b>⚔️ Herd War</b>${w?`<p>vs <b>${esc(w.opp)}</b>: <b>${w.my} – ${w.their}</b> · about ${hrs}h left<br><small>Every member gets ONE attack on a defender from the other herd. A win scores 1 point, and a herd where everyone attacks gets +1 bonus. Winners earn 3,000 coins each.</small></p><button ${w.mine?'disabled':''} onclick="warAttack()">${w.mine?'Attack used':'⚔️ Attack!'}</button>`:c.searching?'<p>🔎 Searching for an opponent herd…</p>':`<p>${c.owner?'Start a search and you will be matched with another herd that is searching (2+ members needed).':'Ask your herd leader to start a war search.'}</p>${c.owner?'<button onclick="cdo(\'findwar\')">Find a herd war</button>':''}`}</div>
<div class="card"><b>🎯 Herd goals</b><br><small>When your herd finishes a goal, each member can claim its special sheep. You need to have been in the herd long enough AND own a regular sheep of the same rarity. Herd sheep only stay in your flock while you are in a herd that has finished that goal.</small>${G.CLAN_GOALS.map(g=>{const cur=g.pts?c.pts:g.wars?c.wins:c.bw,tot=g.pts||g.wars||g.bw,done=cur>=tot,sp=G.SPM[g.sp],own=D.sheep.some(y=>y.sp==g.sp),rar=D.sheep.some(y=>!y.sp&&y.r>=sp.r),left=Math.max(0,g.hrs-inH),ok=done&&rar&&left<=0;
return`<div style="margin:10px 0;padding:6px;border-radius:10px;background:${done?'#eaffea':'#f6f1e6'}"><b>${sp.name}</b> <span class="badge" style="background:${G.RAR[sp.r].c}">${G.RAR[sp.r].n}</span><br>${g.pts?'Donate '+fmt(g.pts)+' coins together':g.wars?'Win '+g.wars+' herd war'+(g.wars>1?'s':''):'Win '+fmt(g.bw)+' battles together'}${done?' ✔':''}<div class="bar"><i style="width:${Math.min(100,100*cur/tot)}%"></i></div><small>${fmt(cur)}/${fmt(tot)} · needs ${g.hrs}h in herd ${left>0?'('+Math.ceil(left)+'h left)':'✔'} · needs your own ${G.RAR[sp.r].n} sheep ${rar?'✔':'✘'}</small><br>${own?'✔ In your flock':`<button ${ok?'':'disabled'} onclick="cdo('claim',{id:'${g.id}'})">Claim sheep</button>`}</div>`}).join('')}<input id="dn" type="number" placeholder="Coins to donate" style="width:60%"> <button onclick="cdo('donate',{amt:$('#dn').value})">Donate</button></div>
<div class="card"><b>💬 Herd chat</b><div style="max-height:150px;overflow:auto;background:#fff;border-radius:8px;padding:6px;margin:6px 0;font-size:13px">${c.chat.map(x=>`<div><b>${esc(x.n)}</b>: ${esc(x.m)}</div>`).join('')||'<i>No messages yet. Say hi!</i>'}</div><input id="cm" placeholder="Message your herd" maxlength="140" style="width:70%"> <button onclick="csay()">Send</button></div>
<div class="card"><button onclick="if(confirm('Leave this herd? Herd goal sheep will leave your flock.'))cdo('leave')" style="background:#c55;box-shadow:0 3px 0 #922">Leave herd</button></div>`};
// leaderboard
let BOARD=[];
V.board=()=>`<div class="card"><h3>🏆 Top Farmers</h3><table><tr><th>#</th><th>Farmer</th><th>Rating</th><th>Wins</th><th>Sheep</th><th>Best</th><th></th></tr>${BOARD.map((x,i)=>`<tr style="${x.name==D.name?'background:#fff2c2':''}"><td>${i+1}</td><td>${x.name}</td><td>${x.rating}</td><td>${x.wins}</td><td>${x.sheep}</td><td style="color:${G.RAR[x.best].c}">${G.RAR[x.best].n}</td><td><button style="padding:3px 10px" onclick="visit('${x.name}')">Visit</button></td></tr>`).join('')||'<tr><td colspan=7>No farmers yet</td></tr>'}</table></div>`;
async function board(){try{BOARD=await fetch('/api/board').then(r=>r.json())}catch{BOARD=[]}tab='board';render()}
async function visit(n){const f=await fetch('/api/farm/'+n).then(r=>r.json());$('#ov').className='on';$('#ov').innerHTML=`<h2>${f.name}'s flock</h2><div class="grid" style="width:100%;max-width:900px;color:#3a2f25">${f.sheep.map(s=>card(s,1)).join('')}</div><br><button onclick="closeOv()">Close</button>`}
fetch('/api/health').then(r=>r.json()).then(h=>{if(h.storage=='file'&&location.hostname!='localhost'&&location.hostname!='127.0.0.1'){const b=document.createElement('div');b.style.cssText='position:sticky;top:0;z-index:30;background:#c0392b;color:#fff;padding:8px 12px;text-align:center;font-weight:bold';b.textContent='⚠️ No database connected: saves will be WIPED when the server sleeps. The host needs to set DATABASE_URL (see README).';document.body.prepend(b)}}).catch(()=>{});
if(T)act('state').then(r=>r.d?start():login()).catch(()=>{});else login();
</script></body></html>
