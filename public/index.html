<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Game Under Maintenance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1020;
      color: #f5f7ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid #29334d;
      border-radius: 20px;
      background: #121a2e;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }
    .icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #27324c;
      font-size: 34px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 7vw, 3.2rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }
    p {
      margin: 0;
      color: #bdc7dc;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .time {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 18px;
      border: 1px solid #3a4968;
      border-radius: 12px;
      background: #1a2540;
      color: #fff;
      font-weight: 650;
    }
    .note {
      margin-top: 22px;
      font-size: .9rem;
      color: #8795b2;
    }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="icon" aria-hidden="true">🔧</div>
    <h1>Game Under Maintenance</h1>
    <p>The game is temporarily unavailable while maintenance is underway.</p>
    <div class="time">Estimated restart time: 3.00</div>
    <p class="note">Please check back later. Thanks for your patience.</p>
  </main>
</body>
</html>
