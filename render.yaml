databases:
  - name: eggwool-db
    plan: free
services:
  - type: web
    name: egg-and-wool
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eggwool-db
          property: connectionString
      - key: SECRET
        generateValue: true
